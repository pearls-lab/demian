# Minimal GitHub Pages (Jekyll) config for the DeMiAn project page.
# Serves the single project page at index.md using the self-contained
# _layouts/project_demian.html (no al-folio / external theme needed).
title: "DeMiAn"
description: "Dense Multi-Aspect Annotation for scaling robot policy learning."

# For a PROJECT page (https://<org>.github.io/<repo>/) set baseurl to "/<repo>"
# so `relative_url` resolves the asset paths. For a USER/ORG page
# (https://<org>.github.io/) leave it empty.
baseurl: "/demian"   # project page -> https://pearls-lab.github.io/demian/
url: ""

# Repo docs that should not become website pages.
exclude:
  - README.md
